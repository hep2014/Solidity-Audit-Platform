services:
  postgres:
    image: postgres:16-alpine
    container_name: solidity-audit-postgres
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: solidity-audit-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solidity-audit-backend-api
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solidity-audit-backend-worker
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    volumes:
      - ./backend/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=1"
      ]

  slither-analyzer:
    build:
      context: ./analyzers/slither
      dockerfile: Dockerfile
    image: solidity-audit-slither:local
    profiles:
      - analyzers

  mythril-analyzer:
    build:
      context: ./analyzers/mythril
      dockerfile: Dockerfile
    image: solidity-audit-mythril:local
    profiles:
      - analyzers

  foundry-analyzer:
    build:
      context: ./analyzers/foundry
      dockerfile: Dockerfile
    image: solidity-audit-foundry:local
    profiles:
      - analyzers

  echidna-analyzer:
    build:
      context: ./analyzers/echidna
      dockerfile: Dockerfile
    image: solidity-audit-echidna:local
    profiles:
      - analyzers

volumes:
  postgres_data:
  redis_data:
